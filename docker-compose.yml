# Local development infrastructure for MeasureX.
# Postgres 16 (primary datastore) + Redis 7 (BullMQ background jobs).
# Not for production — the Saudi-region managed services are configured in
# deployment (PRD A9). Copy .env.example to .env to override defaults.

services:
  postgres:
    image: postgres:16-alpine
    container_name: measurex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-measurex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-measurex}
      POSTGRES_DB: ${POSTGRES_DB:-measurex}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-measurex}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: measurex-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for package photos (private bucket, signed URLs
  # only — PRD §6, §14). Console at http://localhost:9001 (minioadmin/minioadmin).
  minio:
    image: minio/minio:latest
    container_name: measurex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
