name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck & test (TypeScript)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: measurex
          POSTGRES_PASSWORD: measurex
          POSTGRES_DB: measurex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U measurex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://measurex:measurex@localhost:5432/measurex?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 12h

    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field
      # (pnpm@9.12.0). Passing a `version` input too makes action-setup@v4 fail
      # with ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @measurex/api prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @measurex/api prisma:migrate

      - name: Format check
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  flutter:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (also generates localisations)
        run: flutter pub get

      - name: Generate code (Drift database)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  vision-poc:
    name: Lint & test (Vision POC, Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision-poc
    steps:
      - uses: actions/checkout@v4

      # Target runtime per services/vision-poc/CLAUDE.md.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install (core + dev extras)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  m9-android:
    name: Build & test (M9 capture, Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/m9-capture-android
    steps:
      - uses: actions/checkout@v4

      # compileSdk 36 needs JDK 17 (AGP 9 minimum).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install exactly what compileSdk 36 needs. The action's default package set
      # includes the obsolete `tools` package, which no longer exists in the SDK
      # repository and fails the job ("Failed to find package 'tools'").
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # Proves the coordinate tests pass, the app compiles, and a debug APK assembles.
      # The APK is a CI build artefact only — not uploaded (repo policy publishes none).
      - name: Unit tests + assemble debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
