name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck & test (TypeScript)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: measurex
          POSTGRES_PASSWORD: measurex
          POSTGRES_DB: measurex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U measurex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://measurex:measurex@localhost:5432/measurex?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 12h

    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field
      # (pnpm@9.12.0). Passing a `version` input too makes action-setup@v4 fail
      # with ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @measurex/api prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @measurex/api prisma:migrate

      - name: Format check
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  flutter:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (also generates localisations)
        run: flutter pub get

      - name: Generate code (Drift database)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  measure-core:
    name: Build & test (C++ vision core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # conda-forge OpenCV (>= 4.9) ships the ArUco API in the `objdetect`
      # module, matching the OpenCV Android SDK the app links against. This is a
      # fast binary install (no building OpenCV from source) and bundles a C++
      # compiler + cmake + ninja for a hermetic host build.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: measurex
          # Pin to OpenCV 4.x to match the OpenCV Android SDK the app links
          # against (4.x) and its stable imgproc/objdetect API. (5.0 reorganised
          # several imgproc symbols.)
          create-args: >-
            opencv>=4.9,<5
            cmake
            ninja
            cxx-compiler

      - name: Configure, build and test
        shell: bash -el {0}
        run: |
          cmake -S packages/measure-core -B build -G Ninja \
            -DMEASUREX_BUILD_TESTS=ON -DMEASUREX_BUILD_TOOLS=ON \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          cmake --build build
          ctest --test-dir build --output-on-failure
          # Smoke-test the mat generator produces a PNG.
          ./build/measurex_matgen /tmp/mat.png CI-STATION 1200 200
          test -s /tmp/mat.png
