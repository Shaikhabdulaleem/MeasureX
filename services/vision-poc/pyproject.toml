[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "measurex-vision"
version = "0.0.1"
description = "MeasureX camera-only shipment dimensioning — research POC (no mat, no marker, no reference object)."
readme = "README.md"
# Target runtime is Python 3.11 (see CLAUDE.md); >=3.11 lets the pure-geometry
# layer run on newer interpreters until the model stack pins an exact version.
requires-python = ">=3.11"
license = { text = "Proprietary — internal Aymakan use" }

# Core deps only. Heavy model/vision stacks live in optional extras so the
# contracts + pure geometry + tests install and run without a GPU.
dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Installed in later milestones when models are integrated. Kept here as a
# documented shopping list, intentionally un-pinned until each is adopted and
# recorded in the model/license manifest (see VISION_DECISION.md §8).
vision = [
    "opencv-python-headless>=4.9",
    "open3d>=0.18",
    "pyyaml>=6",
]
# Depth model stack (torch + Apple depth_pro). GPU-oriented; targets Python
# 3.11/3.12, not 3.14. Un-pinned beyond lower bounds until adoption (MODELS.md).
# Never installed in CI.
depth = [
    "torch>=2.2",
    "pillow>=10",
    "depth_pro @ git+https://github.com/apple/ml-depth-pro.git",
]
# Segmentation + optional detection stack (Apache-2.0 models). GPU-oriented,
# never installed in CI. Un-pinned beyond lower bounds until adoption (MODELS.md).
seg = [
    "torch>=2.2",
    "pillow>=10",
    "sam2 @ git+https://github.com/facebookresearch/sam2.git",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pillow>=10",
]

[project.scripts]
measurex-vision = "measurex_vision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/measurex_vision"]

# The `depth` extra installs depth_pro straight from Apple's git repo (no PyPI
# release), which is a direct reference — hatchling requires this opt-in.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
