name: measurex
description: MeasureX mobile app (Labour + Team Leader).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  uuid: ^4.5.1
  flutter_blue_plus: ^1.32.12
  # M3 — offline & sync
  drift: ^2.20.0
  sqlite3: ^2.4.6
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.4
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  image: ^4.2.0
  bcrypt: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  generate: true
